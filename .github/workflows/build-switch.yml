name: build-switch
on:
  push:
    branches: ['switch-**']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # soh.o2r holds the port's own assets (fonts, textures, shaders). It's platform independent and is built
  # with the PC asset tools, exactly like the upstream generate-builds workflow does.
  generate-soh-o2r:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Apply libultraship Switch patch
      # soh.o2r embeds libultraship's shaders, so build it from the same tree the .nro uses.
      run: git -C libultraship apply --whitespace=nowarn ../switch/libultraship-switch.patch
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y $(cat linux-build-deps/apt.txt)
    - name: Generate soh.o2r
      run: |
        cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE:STRING=Release -DSOH_TOOLS_ONLY=ON
        cmake --build build-cmake --config Release --target GenerateSohOtr -j4
    - uses: actions/upload-artifact@v4
      with:
        name: soh.o2r
        path: soh.o2r
        retention-days: 3

  build-switch:
    needs: generate-soh-o2r
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
    - name: Install host tools
      run: |
        apt-get update
        apt-get install -y --no-install-recommends ninja-build python3 git ccache curl ca-certificates
    - name: Install Switch portlibs
      # Each one is optional: the CMake build falls back to building a library from source if its
      # portlib is unavailable, so a missing package shouldn't fail the job.
      run: |
        dkp-pacman -Sy --noconfirm || true
        for p in switch-sdl2 switch-sdl2_net switch-glad switch-mesa switch-libdrm_nouveau switch-zlib \
                 switch-bzip2 switch-libzip switch-libogg switch-libvorbis switch-libopus switch-opusfile; do
          dkp-pacman -S --needed --noconfirm "$p" || echo "::warning::portlib $p not available, will build from source"
        done
        # tinyxml2 is built from source (11.x); devkitPro's older headers would shadow it on the include path.
        dkp-pacman -R --noconfirm switch-tinyxml2 2>/dev/null || true
    - name: Mark workspace safe for git
      run: git config --global --add safe.directory '*'
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Apply libultraship Switch patch
      run: git -C libultraship apply --whitespace=nowarn ../switch/libultraship-switch.patch
    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: switch-ccache-${{ github.ref_name }}
        max-size: 2G
    - name: Configure
      shell: bash
      run: |
        set -o pipefail
        cmake -H. -Bbuild-switch -GNinja \
          -DCMAKE_TOOLCHAIN_FILE=/opt/devkitpro/cmake/Switch.cmake \
          -DCMAKE_BUILD_TYPE:STRING=Release \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache 2>&1 | tee -a switch-build.log
    - name: Build soh.nro
      shell: bash
      run: |
        set -o pipefail
        # -k 0 keeps going past the first failing file so one CI run reports as many errors as possible.
        cmake --build build-switch --target soh_nro -j"$(nproc)" -- -k 0 2>&1 | tee -a switch-build.log
    - name: Report errors as annotations
      if: failure()
      shell: bash
      run: |
        [ -f switch-build.log ] || exit 0
        # Compiler command lines are huge and useless here; keep diagnostics only.
        grep -vE "^(ccache |/opt/devkitpro/.*-(gcc|g\+\+) )" switch-build.log > diag.log || true
        {
          echo "FAILED TARGETS:"; grep -E "^FAILED:" diag.log | sort -u
          echo; echo "FIRST ERROR PER FILE:"
          grep -E "(error|Error):|undefined reference|CMake Error" diag.log | awk -F: '!seen[$1]++' 
          echo; echo "ALL ERROR LINES:"
          grep -E -A2 "(fatal )?error:|undefined reference|CMake Error" diag.log | grep -v "^--$" | awk '!seen[$0]++'
        } | cut -c1-400 | head -n 900 > errors.txt
        [ -s errors.txt ] || tail -n 120 switch-build.log > errors.txt
        split -l 90 errors.txt chunk_
        n=0
        for f in chunk_*; do
          n=$((n+1)); [ $n -gt 10 ] && break
          body=$(sed -e 's/%/%25/g' -e 's/\r//g' "$f" | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=switch build log part $n::$body"
        done
    - name: Download soh.o2r
      uses: actions/download-artifact@v4
      with:
        name: soh.o2r
        path: package/switch/soh
    - name: Package
      run: |
        cp build-switch/soh/soh.nro package/switch/soh/soh.nro
        cp switch/README.md package/README-Switch.txt
        ls -la package/switch/soh
    - name: Verify soh.nro
      shell: bash
      run: |
        nro=package/switch/soh/soh.nro
        magic=$(dd if="$nro" bs=1 skip=16 count=4 2>/dev/null)
        [ "$magic" = "NRO0" ] || { echo "::error::soh.nro has no NRO0 header (got '$magic')"; exit 1; }
        grep -aq "Ship of Harkinian" "$nro" || { echo "::error::soh.nro is missing its NACP title"; exit 1; }
        # The thread-stack fix only works if the linker actually routed pthread_create through the wrapper.
        nm=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-nm
        $nm build-switch/soh/soh.elf | grep -q " T __wrap___syscall_thread_create$" \
          || { echo "::error::__syscall_thread_create wrapper missing from soh.elf"; exit 1; }
        [ -s package/switch/soh/soh.o2r ] || { echo "::error::soh.o2r missing from package"; exit 1; }
        echo "::notice title=soh.nro::NRO0 header ok, $(stat -c%s "$nro") bytes; soh.o2r $(stat -c%s package/switch/soh/soh.o2r) bytes; built from $GITHUB_SHA"
    - uses: actions/upload-artifact@v4
      with:
        # Unzip onto the root of the SD card: it creates /switch/soh/.
        name: SoH-Dewey-Alpha-Switch
        path: package
    - name: Keep symbols for crash reports
      # The .nro is built from this ELF (linked at address 0), so offsets in an Atmosphere crash report for the
      # soh module map straight onto it with addr2line.
      run: xz -T0 -c build-switch/soh/soh.elf > soh.elf.xz
    - uses: actions/upload-artifact@v4
      with:
        name: soh-elf
        path: soh.elf.xz

  # Publish each green build as a pre-release on this fork: one zip to extract onto the SD card root.
  publish:
    needs: build-switch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: SoH-Dewey-Alpha-Switch
        path: package
    - uses: actions/download-artifact@v4
      with:
        name: soh-elf
        path: .
    - name: Create release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}-latest
      run: |
        (cd package && zip -r ../SoH-Dewey-Alpha-Switch.zip .)
        gh release delete "$TAG" -R "$GITHUB_REPOSITORY" --cleanup-tag -y || true
        gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
          --title "SoH 9.3.0 Dewey Alpha for Switch (unofficial, ${GITHUB_SHA::7})" \
          --notes-file package/README-Switch.txt \
          SoH-Dewey-Alpha-Switch.zip soh.elf.xz
